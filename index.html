<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WeatherTrack trip planning map" />
    <title>WeatherTrack</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>WeatherTrack</h1>
    </header>
    <div class="app-shell">
      <main id="map" aria-label="Interactive trip planning map"></main>
      <section class="trip-tools" aria-labelledby="trip-tools-title">
        <h2 id="trip-tools-title">Plan a trip</h2>
        <p class="instructions">
          Start a trip, then click the map to plot its track.
        </p>
        <label class="trip-name">
          Trip name
          <input id="trip-name" type="text" maxlength="100" />
        </label>
        <label class="trip-date">
          Trip start date
          <input id="trip-date" type="date" />
        </label>
        <div class="tool-buttons">
          <button id="new-trip" type="button">New trip</button>
          <button id="undo-point" type="button" disabled>Undo</button>
          <button id="finish-track" type="button" disabled>
            Finish track
          </button>
          <button id="add-waypoint" type="button" disabled>Add stop</button>
          <button id="save-trip" type="button" disabled>Save</button>
          <button id="clear-trip" type="button" disabled>Clear</button>
        </div>
        <label class="snap-option">
          <input id="snap-to-routes" type="checkbox" checked />
          Snap to trails and roads when available
        </label>
        <output id="trip-status" aria-live="polite">
          Select “New trip” to begin.
        </output>
        <ol id="waypoint-list" aria-label="Trip stops"></ol>
        <section class="forecast-panel" aria-labelledby="forecast-title">
          <div class="forecast-heading">
            <h2 id="forecast-title">NWS forecast</h2>
            <button id="update-forecast" type="button" disabled>Update</button>
          </div>
          <p class="forecast-help">
            Stop 1 uses the trip start date; each following stop is one day
            later.
          </p>
          <output id="forecast-status" aria-live="polite">
            Add a stop to load its NWS forecast.
          </output>
          <div id="forecast-results"></div>
        </section>
        <small>Routing data © OpenStreetMap contributors</small>
      </section>
    </div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
